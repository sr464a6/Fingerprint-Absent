<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar Siswa - Sistem Absensi</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, Helvetica, sans-serif;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .page-header p {
            color: #6c757d;
            margin: 0;
        }

        .card {
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .card-header {
            background: white;
            padding: 18px 20px;
            border-bottom: 1px solid #dee2e6;
        }

        .card-title {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .card-body {
            padding: 25px;
        }

        .table {
            vertical-align: middle;
        }

        .table thead th {
            background: #f8f9fa;
            white-space: nowrap;
        }

        .student-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e9ecef;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
        }

        .badge {
            padding: 6px 10px;
        }

        .search-box {
            max-width: 350px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .empty-state i {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                padding: 15px;
            }

            .page-header h1 {
                font-size: 24px;
            }

            .card-body {
                padding: 15px;
            }

            .search-box {
                max-width: 100%;
                margin-top: 15px;
            }
        }
    </style>
</head>

<body>

<div class="dashboard-container">

    <!-- HEADER -->
    <div class="page-header">
        <h1>Daftar Siswa</h1>
        <p>Data siswa yang terdaftar dalam sistem</p>
    </div>


    <!-- CARD -->
    <div class="card">

        <div class="card-header">

            <div class="d-flex justify-content-between align-items-center flex-wrap">

                <h3 class="card-title">
                    <i class="bi bi-people-fill"></i>
                    Data Siswa
                </h3>

                <div class="search-box">
                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Cari nama atau NISN..."
                    >
                </div>

            </div>

        </div>


        <div class="card-body">

            <!-- INFO -->
            <div class="alert alert-info">
                <i class="bi bi-info-circle"></i>
                Total siswa:
                <strong id="totalSiswa">0</strong>
            </div>


            <!-- TABLE -->
            <div class="table-responsive">

                <table class="table table-bordered table-striped">

                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama Siswa</th>
                            <th>NISN</th>
                            <th>Status Fingerprint</th>
                        </tr>
                    </thead>

                    <tbody id="siswaBody"></tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

    /*
     * ==========================================
     * DATA SISWA DEMO
     * ==========================================
     */

    const dataSiswa = [

        {
            nama: "AHMAD FAUZAN",
            nisn: "0012345678",
            fingerprint: true
        },

        {
            nama: "MUHAMMAD RIZKY",
            nisn: "0012345679",
            fingerprint: true
        },

        {
            nama: "SITI AISYAH",
            nisn: "0012345680",
            fingerprint: true
        },

        {
            nama: "NURUL HIDAYAH",
            nisn: "0012345681",
            fingerprint: false
        },

        {
            nama: "BUDI SANTOSO",
            nisn: "0012345682",
            fingerprint: true
        },

        {
            nama: "DIMAS PRATAMA",
            nisn: "0012345683",
            fingerprint: false
        },

        {
            nama: "FAJAR HIDAYAT",
            nisn: "0012345684",
            fingerprint: true
        },

        {
            nama: "RIZKI RAMADHAN",
            nisn: "0012345685",
            fingerprint: true
        }

    ];


    /*
     * ==========================================
     * RENDER SISWA
     * ==========================================
     */

    function renderSiswa(keyword = "") {

        const tbody =
            document.getElementById("siswaBody");

        const total =
            document.getElementById("totalSiswa");


        const search =
            keyword.toLowerCase().trim();


        const filtered =
            dataSiswa.filter(function(siswa) {

                return (
                    siswa.nama.toLowerCase().includes(search) ||
                    siswa.nisn.includes(search)
                );

            });


        total.textContent = filtered.length;

        tbody.innerHTML = "";


        /*
         * Tidak ada data
         */

        if (filtered.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="4">

                        <div class="empty-state">

                            <i class="bi bi-person-x"></i>

                            <div>
                                Siswa tidak ditemukan.
                            </div>

                        </div>

                    </td>
                </tr>
            `;

            return;
        }


        /*
         * Tampilkan data
         */

        filtered.forEach(function(siswa, index) {

            let fingerprintStatus;


            if (siswa.fingerprint) {

                fingerprintStatus = `
                    <span class="badge bg-success">
                        <i class="bi bi-check-circle"></i>
                        Terdaftar
                    </span>
                `;

            } else {

                fingerprintStatus = `
                    <span class="badge bg-warning text-dark">
                        <i class="bi bi-exclamation-circle"></i>
                        Belum Terdaftar
                    </span>
                `;

            }


            tbody.innerHTML += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>

                        <span class="student-icon">
                            <i class="bi bi-person"></i>
                        </span>

                        <strong>
                            ${siswa.nama}
                        </strong>

                    </td>

                    <td>
                        ${siswa.nisn}
                    </td>

                    <td>
                        ${fingerprintStatus}
                    </td>

                </tr>

            `;

        });

    }


    /*
     * ==========================================
     * SEARCH
     * ==========================================
     */

    document
        .getElementById("searchInput")
        .addEventListener("input", function() {

            renderSiswa(this.value);

        });


    /*
     * ==========================================
     * LOAD PERTAMA
     * ==========================================
     */

    renderSiswa();

</script>

</body>
</html>
