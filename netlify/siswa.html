<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daftar Siswa - Sistem Absensi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Tampilan -->
    <link rel="stylesheet" href="assets/css/app.css">
</head>

<body>

    <aside class="side">

        <a href="index.html" class="brand">
            <i class="bi bi-fingerprint"></i>
            <span><b>Absensi</b> Siswa</span>
        </a>

        <nav class="side-nav">
            <a href="index.html">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>
            <a href="enroll.html">
                <i class="bi bi-fingerprint"></i>
                <span>Enroll Siswa</span>
            </a>
            <a href="siswa.html" class="active">
                <i class="bi bi-people"></i>
                <span>Daftar Siswa</span>
            </a>
            <a href="absensi.html">
                <i class="bi bi-clipboard-check"></i>
                <span>Absensi</span>
            </a>
            <a href="izin.html">
                <i class="bi bi-file-earmark-medical"></i>
                <span>Form Izin/Sakit</span>
            </a>
        </nav>

    </aside>


    <div class="shell">

        <header class="topbar">
            <div class="topbar-title">Sistem Absensi Siswa</div>
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                Administrator
            </div>
        </header>

        <main class="page">

            <div class="page-head">
                <h1>Daftar Siswa</h1>
                <p>Data siswa yang terdaftar dalam sistem</p>
            </div>

            <div class="card">

                <div class="card-header">
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

                        <h3 class="card-title">
                            <i class="bi bi-people"></i>
                            Data Siswa
                        </h3>

                        <div class="search">
                            <i class="bi bi-search"></i>
                            <input
                                type="text"
                                id="searchInput"
                                class="form-control"
                                placeholder="Cari nama atau NISN..."
                            >
                        </div>

                    </div>
                </div>

                <div class="card-body">

                    <p class="count">
                        Total siswa:
                        <strong id="totalSiswa">0</strong>
                    </p>

                    <div class="table-wrap">
                        <div class="table-responsive">
                            <table class="table">

                                <thead>
                                    <tr>
                                        <th>No</th>
                                        <th>Nama Siswa</th>
                                        <th>NISN</th>
                                        <th>Status Fingerprint</th>
                                    </tr>
                                </thead>

                                <tbody id="siswaBody"></tbody>

                            </table>
                        </div>
                    </div>

                </div>

            </div>

        </main>

        <footer class="foot">
            <strong>Copyright &copy; 2026 Absensi Siswa.</strong>
            All rights reserved.
        </footer>

    </div>

<script>

    /*
     * ==========================================
     * DATA SISWA DEMO
     * ==========================================
     */

    const dataSiswa = [

        {
            nama: "AHMAD FAUZAN",
            nisn: "0012345678",
            fingerprint: true
        },

        {
            nama: "MUHAMMAD RIZKY",
            nisn: "0012345679",
            fingerprint: true
        },

        {
            nama: "SITI AISYAH",
            nisn: "0012345680",
            fingerprint: true
        },

        {
            nama: "NURUL HIDAYAH",
            nisn: "0012345681",
            fingerprint: false
        },

        {
            nama: "BUDI SANTOSO",
            nisn: "0012345682",
            fingerprint: true
        },

        {
            nama: "DIMAS PRATAMA",
            nisn: "0012345683",
            fingerprint: false
        },

        {
            nama: "FAJAR HIDAYAT",
            nisn: "0012345684",
            fingerprint: true
        },

        {
            nama: "RIZKI RAMADHAN",
            nisn: "0012345685",
            fingerprint: true
        }

    ];


    /*
     * ==========================================
     * RENDER SISWA
     * ==========================================
     */

    function renderSiswa(keyword = "") {

        const tbody =
            document.getElementById("siswaBody");

        const total =
            document.getElementById("totalSiswa");


        const search =
            keyword.toLowerCase().trim();


        const filtered =
            dataSiswa.filter(function(siswa) {

                return (
                    siswa.nama.toLowerCase().includes(search) ||
                    siswa.nisn.includes(search)
                );

            });


        total.textContent = filtered.length;

        tbody.innerHTML = "";


        /*
         * Tidak ada data
         */

        if (filtered.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="4">

                        <div class="empty-state">

                            <i class="bi bi-person-x"></i>

                            <div>
                                Siswa tidak ditemukan.
                            </div>

                        </div>

                    </td>
                </tr>
            `;

            return;
        }


        /*
         * Tampilkan data
         */

        filtered.forEach(function(siswa, index) {

            let fingerprintStatus;


            if (siswa.fingerprint) {

                fingerprintStatus = `
                    <span class="badge bg-success">
                        <i class="bi bi-check-circle"></i>
                        Terdaftar
                    </span>
                `;

            } else {

                fingerprintStatus = `
                    <span class="badge bg-warning text-dark">
                        <i class="bi bi-exclamation-circle"></i>
                        Belum Terdaftar
                    </span>
                `;

            }


            tbody.innerHTML += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>

                        <span class="student-icon">
                            <i class="bi bi-person"></i>
                        </span>

                        <strong>
                            ${siswa.nama}
                        </strong>

                    </td>

                    <td>
                        ${siswa.nisn}
                    </td>

                    <td>
                        ${fingerprintStatus}
                    </td>

                </tr>

            `;

        });

    }


    /*
     * ==========================================
     * SEARCH
     * ==========================================
     */

    document
        .getElementById("searchInput")
        .addEventListener("input", function() {

            renderSiswa(this.value);

        });


    /*
     * ==========================================
     * LOAD PERTAMA
     * ==========================================
     */

    renderSiswa();

</script>

</body>
</html>
