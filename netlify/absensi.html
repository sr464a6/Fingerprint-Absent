<head>
    <meta charset="UTF-8">

    <!-- Bootstrap 5 -->

    <!-- Bootstrap Icons -->

    <!-- Flatpickr -->

    <!-- Tampilan -->
    <link rel="stylesheet" href="assets/css/app.css">
</head>

<body>

    <aside class="side">

        <a href="index.html" class="brand">
            <i class="bi bi-fingerprint"></i>
            <span><b>Absensi</b> Siswa</span>
        </a>

        <nav class="side-nav">
            <a href="index.html">

                <span>Dashboard</span>
            </a>
            <a href="enroll.html">
                <i class="bi bi-fingerprint"></i>
                <span>Enroll Siswa</span>
            </a>
            <a href="siswa.html">
                <i class="bi bi-people"></i>
                <span>Daftar Siswa</span>
            </a>
            <a href="absensi.html" class="active">
                <i class="bi bi-clipboard-check"></i>
                <span>Absensi</span>

            <a href="izin.html">
                <i class="bi bi-file-earmark-medical"></i>

            </a>
        </nav>

    </aside>


    <div class="shell">

        <header class="topbar">
            <div class="topbar-title">Sistem Absensi Siswa</div>
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                Administrator
            </div>
        </header>

        <main class="page">

            <div class="page-head">
                <h1>Data Absensi</h1>
                <p>Data kehadiran siswa</p>
            </div>

            <div class="card">

                <div class="card-header">
                    <h3 class="card-title">Data Absensi Siswa</h3>
                </div>

                <div class="card-body">

                    <div class="filter-row">
                        <label for="tanggalPicker" class="filter-label">
                            Pilih Tanggal:
                        </label>

                        <input
                            type="text"
                            id="tanggalPicker"
                            class="form-control"
                            value="2026-08-26"
                        >
                    </div>

                    <div class="table-wrap">
                        <div class="table-responsive">
                            <table id="absensiTable" class="table">

                                <thead>
                                    <tr>
                                        <th>No</th>
                                        <th>Nama</th>
                                        <th>Keterangan</th>
                                        <th>Alasan</th>
                                        <th>Foto</th>
                                        <th>Jam</th>
                                    </tr>
                                </thead>

                                <tbody id="absensiBody"></tbody>

                            </table>
                        </div>
                    </div>

                </div>

            </div>

        </main>

        <footer class="foot">
            <strong>Copyright &copy; 2026 Absensi Siswa.</strong>
            All rights reserved.
        </footer>

    </div>

<!-- Flatpickr -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>

    /*
     * ============================================
     * DATA ABSENSI DEMO
     * ============================================
     *
     * Data ini menggantikan data dari:
     * {{ route('absensi.data') }}
     *
     * Nanti kalau backend Laravel sudah online,
     * data ini bisa diganti dengan API Laravel.
     */

    const dataAbsensi = [

        {
            tanggal: "2026-08-26",
            nama: "Ahmad Fauzan",
            keterangan: "Hadir",
            alasan: "-",
            foto: "",
            jam: "07:02"
        },

        {
            tanggal: "2026-08-26",
            nama: "Muhammad Rizky",
            keterangan: "Hadir",
            alasan: "-",
            foto: "",
            jam: "07:05"
        },

        {
            tanggal: "2026-08-26",
            nama: "Siti Aisyah",
            keterangan: "Hadir",
            alasan: "-",
            foto: "",
            jam: "07:08"
        },

        {
            tanggal: "2026-08-26",
            nama: "Nurul Hidayah",
            keterangan: "Izin",
            alasan: "Keperluan keluarga",
            foto: "",
            jam: "-"
        },

        {
            tanggal: "2026-08-26",
            nama: "Budi Santoso",
            keterangan: "Sakit",
            alasan: "Demam",
            foto: "",
            jam: "-"
        },

        {
            tanggal: "2026-08-26",
            nama: "Dimas Pratama",
            keterangan: "Hadir",
            alasan: "-",
            foto: "",
            jam: "07:15"
        },

        {
            tanggal: "2026-08-25",
            nama: "Ahmad Fauzan",
            keterangan: "Hadir",
            alasan: "-",
            foto: "",
            jam: "07:01"
        },

        {
            tanggal: "2026-08-25",
            nama: "Siti Aisyah",
            keterangan: "Hadir",
            alasan: "-",
            foto: "",
            jam: "07:04"
        }

    ];


    /*
     * ============================================
     * RENDER DATA
     * ============================================
     */

    function renderAbsensi(tanggal) {

        const tbody = document.getElementById("absensiBody");

        tbody.innerHTML = "";

        const filteredData = dataAbsensi
            .filter(item => item.tanggal === tanggal)
            .sort((a, b) => {

                if (a.jam === "-") return 1;
                if (b.jam === "-") return -1;

                return b.jam.localeCompare(a.jam);

            });


        if (filteredData.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="6">
                        <div class="empty-state">
                            <i class="bi bi-calendar-x"></i>
                            <div>Tidak ada data absensi pada tanggal ini.</div>
                        </div>
                    </td>
                </tr>
            `;

            return;
        }


        filteredData.forEach((item, index) => {

            let badgeClass = "bg-secondary";

            if (item.keterangan === "Hadir") {
                badgeClass = "bg-success";
            }

            if (item.keterangan === "Izin") {
                badgeClass = "bg-warning text-dark";
            }

            if (item.keterangan === "Sakit") {
                badgeClass = "bg-danger";
            }


            let fotoHTML;

            if (item.foto) {

                fotoHTML = `
                    <img
                        src="${item.foto}"
                        alt="Foto ${item.nama}"
                        class="foto-siswa"
                    >
                `;

            } else {

                fotoHTML = `
                    <div class="foto-siswa">
                        <i class="bi bi-person"></i>
                    </div>
                `;

            }


            tbody.innerHTML += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        <strong>${item.nama}</strong>
                    </td>

                    <td>
                        <span class="badge ${badgeClass}">
                            ${item.keterangan}
                        </span>
                    </td>

                    <td>
                        ${item.alasan || "-"}
                    </td>

                    <td>
                        ${fotoHTML}
                    </td>

                    <td>
                        ${item.jam}
                    </td>

                </tr>

            `;

        });

    }


    /*
     * ============================================
     * FLATPICKR
     * ============================================
     */

    flatpickr("#tanggalPicker", {

        dateFormat: "Y-m-d",

        defaultDate: "2026-08-26",

        onChange: function(selectedDates, dateStr) {

            renderAbsensi(dateStr);

        }

    });


    /*
     * ============================================
     * LOAD DATA PERTAMA KALI
     * ============================================
     */

    renderAbsensi("2026-08-26");

</script>

</body>
</html>
