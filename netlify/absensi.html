<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Absensi - Sistem Absensi Siswa</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Flatpickr -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    >

    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, Helvetica, sans-serif;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .page-header p {
            color: #6c757d;
            margin: 0;
        }

        .card {
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #dee2e6;
            padding: 18px 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }

        .card-body {
            padding: 25px;
        }

        .table {
            margin-bottom: 0;
            vertical-align: middle;
        }

        .table thead th {
            white-space: nowrap;
            background-color: #f8f9fa;
        }

        .table tbody td {
            vertical-align: middle;
        }

        .badge {
            font-size: 12px;
            padding: 6px 10px;
        }

        .foto-siswa {
            width: 45px;
            height: 45px;
            border-radius: 6px;
            object-fit: cover;
            background-color: #e9ecef;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
        }

        .filter-label {
            font-weight: 500;
            margin-bottom: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6c757d;
        }

        .empty-state i {
            font-size: 40px;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                padding: 15px;
            }

            .page-header h1 {
                font-size: 24px;
            }

            .card-body {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="dashboard-container">

    <!-- Header -->
    <div class="page-header">
        <h1>Data Absensi</h1>
        <p>Data kehadiran siswa</p>
    </div>

    <!-- Card -->
    <div class="card">

        <div class="card-header">
            <h3 class="card-title">
                Data Absensi Siswa
            </h3>
        </div>

        <div class="card-body">

            <!-- Filter -->
            <div class="row mb-4">

                <div class="col-md-4">

                    <label
                        for="tanggalPicker"
                        class="filter-label"
                    >
                        Pilih Tanggal:
                    </label>

                    <input
                        type="text"
                        id="tanggalPicker"
                        class="form-control"
                        value="2026-08-26"
                    >

                </div>

            </div>

            <!-- Table -->
            <div class="table-responsive">

                <table
                    id="absensiTable"
                    class="table table-bordered table-striped"
                >

                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama</th>
                            <th>Keterangan</th>
                            <th>Alasan</th>
                            <th>Foto</th>
                            <th>Jam</th>
                        </tr>
                    </thead>

                    <tbody id="absensiBody">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<!-- Flatpickr -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>

    /*
     * ============================================
     * DATA ABSENSI DEMO
     * ============================================
     *
     * Data ini menggantikan data dari:
     * {{ route('absensi.data') }}
     *
     * Nanti kalau backend Laravel sudah online,
     * data ini bisa diganti dengan API Laravel.
     */

    const dataAbsensi = [

        {
            tanggal: "2026-08-26",
            nama: "Ahmad Fauzan",
            keterangan: "Hadir",
            alasan: "-",
            foto: "",
            jam: "07:02"
        },

        {
            tanggal: "2026-08-26",
            nama: "Muhammad Rizky",
            keterangan: "Hadir",
            alasan: "-",
            foto: "",
            jam: "07:05"
        },

        {
            tanggal: "2026-08-26",
            nama: "Siti Aisyah",
            keterangan: "Hadir",
            alasan: "-",
            foto: "",
            jam: "07:08"
        },

        {
            tanggal: "2026-08-26",
            nama: "Nurul Hidayah",
            keterangan: "Izin",
            alasan: "Keperluan keluarga",
            foto: "",
            jam: "-"
        },

        {
            tanggal: "2026-08-26",
            nama: "Budi Santoso",
            keterangan: "Sakit",
            alasan: "Demam",
            foto: "",
            jam: "-"
        },

        {
            tanggal: "2026-08-26",
            nama: "Dimas Pratama",
            keterangan: "Hadir",
            alasan: "-",
            foto: "",
            jam: "07:15"
        },

        {
            tanggal: "2026-08-25",
            nama: "Ahmad Fauzan",
            keterangan: "Hadir",
            alasan: "-",
            foto: "",
            jam: "07:01"
        },

        {
            tanggal: "2026-08-25",
            nama: "Siti Aisyah",
            keterangan: "Hadir",
            alasan: "-",
            foto: "",
            jam: "07:04"
        }

    ];


    /*
     * ============================================
     * RENDER DATA
     * ============================================
     */

    function renderAbsensi(tanggal) {

        const tbody = document.getElementById("absensiBody");

        tbody.innerHTML = "";

        const filteredData = dataAbsensi
            .filter(item => item.tanggal === tanggal)
            .sort((a, b) => {

                if (a.jam === "-") return 1;
                if (b.jam === "-") return -1;

                return b.jam.localeCompare(a.jam);

            });


        if (filteredData.length === 0) {

            tbody.innerHTML = `
                <tr>
                    <td colspan="6">
                        <div class="empty-state">
                            <i class="bi bi-calendar-x"></i>
                            <div>Tidak ada data absensi pada tanggal ini.</div>
                        </div>
                    </td>
                </tr>
            `;

            return;
        }


        filteredData.forEach((item, index) => {

            let badgeClass = "bg-secondary";

            if (item.keterangan === "Hadir") {
                badgeClass = "bg-success";
            }

            if (item.keterangan === "Izin") {
                badgeClass = "bg-warning text-dark";
            }

            if (item.keterangan === "Sakit") {
                badgeClass = "bg-danger";
            }


            let fotoHTML;

            if (item.foto) {

                fotoHTML = `
                    <img
                        src="${item.foto}"
                        alt="Foto ${item.nama}"
                        class="foto-siswa"
                    >
                `;

            } else {

                fotoHTML = `
                    <div class="foto-siswa">
                        <i class="bi bi-person"></i>
                    </div>
                `;

            }


            tbody.innerHTML += `

                <tr>

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        <strong>${item.nama}</strong>
                    </td>

                    <td>
                        <span class="badge ${badgeClass}">
                            ${item.keterangan}
                        </span>
                    </td>

                    <td>
                        ${item.alasan || "-"}
                    </td>

                    <td>
                        ${fotoHTML}
                    </td>

                    <td>
                        ${item.jam}
                    </td>

                </tr>

            `;

        });

    }


    /*
     * ============================================
     * FLATPICKR
     * ============================================
     */

    flatpickr("#tanggalPicker", {

        dateFormat: "Y-m-d",

        defaultDate: "2026-08-26",

        onChange: function(selectedDates, dateStr) {

            renderAbsensi(dateStr);

        }

    });


    /*
     * ============================================
     * LOAD DATA PERTAMA KALI
     * ============================================
     */

    renderAbsensi("2026-08-26");

</script>

</body>
</html>
