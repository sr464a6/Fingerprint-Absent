<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Izin/Sakit - Sistem Absensi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Tampilan -->
    <link rel="stylesheet" href="assets/css/app.css">
</head>

<body>

    <aside class="side">

        <a href="index.html" class="brand">
            <i class="bi bi-fingerprint"></i>
            <span><b>Absensi</b> Siswa</span>
        </a>

        <nav class="side-nav">
            <a href="index.html">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>
            <a href="enroll.html">
                <i class="bi bi-fingerprint"></i>
                <span>Enroll Siswa</span>
            </a>
            <a href="siswa.html">
                <i class="bi bi-people"></i>
                <span>Daftar Siswa</span>
            </a>
            <a href="absensi.html">
                <i class="bi bi-clipboard-check"></i>
                <span>Absensi</span>
            </a>
            <a href="izin.html" class="active">
                <i class="bi bi-file-earmark-medical"></i>
                <span>Form Izin/Sakit</span>
            </a>
        </nav>

    </aside>


    <div class="shell">

        <header class="topbar">
            <div class="topbar-title">Sistem Absensi Siswa</div>
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                Administrator
            </div>
        </header>

        <main class="page">

            <div class="page-head">
                <h1>Form Izin/Sakit</h1>
                <p>Input izin atau sakit siswa</p>
            </div>

            <div class="card form-narrow">

                <div class="card-header">
                    <h3 class="card-title">Input Izin/Sakit Siswa</h3>
                </div>

                <form id="izinForm">

                    <div class="card-body">

                        <div class="mb-3">
                            <label for="siswa" class="form-label">
                                Nama Siswa
                                <span class="required">*</span>
                            </label>

                            <select id="siswa" class="form-select" required>
                                <option value="">-- Pilih Siswa --</option>
                                <option value="1">Ahmad Fauzan - 0012345678</option>
                                <option value="2">Muhammad Rizky - 0012345679</option>
                                <option value="3">Siti Aisyah - 0012345680</option>
                                <option value="4">Nurul Hidayah - 0012345681</option>
                                <option value="5">Budi Santoso - 0012345682</option>
                                <option value="6">Dimas Pratama - 0012345683</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Keterangan
                                <span class="required">*</span>
                            </label>

                            <div class="seg">
                                <input type="radio" name="keterangan" id="izin" value="izin" required>
                                <label for="izin">Izin</label>

                                <input type="radio" name="keterangan" id="sakit" value="sakit" required>
                                <label for="sakit">Sakit</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="alasan" class="form-label">
                                Alasan
                                <span class="required">*</span>
                            </label>

                            <textarea
                                id="alasan"
                                class="form-control"
                                rows="3"
                                placeholder="Masukkan alasan izin atau sakit"
                                required
                            ></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="foto" class="form-label">
                                Upload Bukti (Opsional)
                            </label>

                            <input
                                type="file"
                                class="form-control"
                                id="foto"
                                accept="image/jpeg,image/jpg,image/png"
                            >

                            <small class="file-info">
                                Format: JPG, JPEG, PNG. Maks 2MB
                            </small>
                        </div>

                        <div id="statusMessage" class="alert" style="display:none"></div>

                    </div>

                    <div class="card-footer">

                        <button type="submit" class="btn btn-primary" id="btnSimpan">
                            <i class="bi bi-save"></i>
                            Simpan
                        </button>

                        <button type="reset" class="btn btn-secondary" id="btnReset">
                            <i class="bi bi-arrow-clockwise"></i>
                            Reset
                        </button>

                    </div>

                </form>

            </div>

        </main>

        <footer class="foot">
            <strong>Copyright &copy; 2026 Absensi Siswa.</strong>
            All rights reserved.
        </footer>

    </div>

<script>

    const form = document.getElementById("izinForm");
    const siswa = document.getElementById("siswa");
    const alasan = document.getElementById("alasan");
    const foto = document.getElementById("foto");

    const btnSimpan = document.getElementById("btnSimpan");
    const btnReset = document.getElementById("btnReset");

    const statusMessage = document.getElementById("statusMessage");


    /*
     * ==========================================
     * VALIDASI FILE
     * ==========================================
     */

    foto.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {
            return;
        }

        const allowedTypes = [
            "image/jpeg",
            "image/jpg",
            "image/png"
        ];

        const maxSize = 2 * 1024 * 1024;


        if (!allowedTypes.includes(file.type)) {

            showStatus(
                "danger",
                '<i class="bi bi-exclamation-circle"></i> ' +
                "Format file harus JPG, JPEG, atau PNG."
            );

            this.value = "";

            return;
        }


        if (file.size > maxSize) {

            showStatus(
                "danger",
                '<i class="bi bi-exclamation-circle"></i> ' +
                "Ukuran file maksimal 2MB."
            );

            this.value = "";

            return;
        }


        statusMessage.style.display = "none";

    });


    /*
     * ==========================================
     * SUBMIT FORM
     * ==========================================
     */

    form.addEventListener("submit", function (event) {

        event.preventDefault();


        const siswaText =
            siswa.options[siswa.selectedIndex].text;

        const keterangan =
            document.querySelector(
                'input[name="keterangan"]:checked'
            )?.value;


        if (!siswa.value) {

            showStatus(
                "danger",
                '<i class="bi bi-exclamation-circle"></i> ' +
                "Silakan pilih siswa."
            );

            return;
        }


        if (!keterangan) {

            showStatus(
                "danger",
                '<i class="bi bi-exclamation-circle"></i> ' +
                "Silakan pilih keterangan Izin atau Sakit."
            );

            return;
        }


        if (!alasan.value.trim()) {

            showStatus(
                "danger",
                '<i class="bi bi-exclamation-circle"></i> ' +
                "Alasan wajib diisi."
            );

            return;
        }


        /*
         * Tombol processing
         */

        btnSimpan.disabled = true;

        btnSimpan.innerHTML = `
            <span
                class="spinner-border spinner-border-sm"
                role="status"
            ></span>
            Menyimpan...
        `;


        /*
         * Simulasi penyimpanan
         */

        setTimeout(function () {

            const jenis =
                keterangan === "izin"
                    ? "Izin"
                    : "Sakit";


            showStatus(
                "success",
                `
                <i class="bi bi-check-circle"></i>

                <strong>Data berhasil disimpan!</strong>

                <br><br>

                <strong>Siswa:</strong>
                ${siswaText}

                <br>

                <strong>Keterangan:</strong>
                ${jenis}

                <br>

                <strong>Alasan:</strong>
                ${alasan.value}
                `
            );


            btnSimpan.disabled = false;

            btnSimpan.innerHTML = `
                <i class="bi bi-save"></i>
                Simpan
            `;


        }, 1000);

    });


    /*
     * ==========================================
     * RESET
     * ==========================================
     */

    btnReset.addEventListener("click", function () {

        statusMessage.style.display = "none";

        statusMessage.innerHTML = "";

        statusMessage.className = "alert";

    });


    /*
     * ==========================================
     * STATUS
     * ==========================================
     */

    function showStatus(type, message) {

        statusMessage.className =
            "alert alert-" + type;

        statusMessage.innerHTML =
            message;

        statusMessage.style.display =
            "block";

    }

</script>

</body>
</html>
