<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Izin/Sakit - Sistem Absensi</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            background-color: #f4f6f9;
            font-family: Arial, Helvetica, sans-serif;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .page-header p {
            color: #6c757d;
            margin: 0;
        }

        .card {
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #dee2e6;
            padding: 18px 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }

        .card-body {
            padding: 25px;
        }

        .card-footer {
            background-color: #fff;
            border-top: 1px solid #dee2e6;
            padding: 15px 25px;
        }

        .form-label {
            font-weight: 500;
        }

        .required {
            color: #dc3545;
        }

        .form-control,
        .form-select {
            padding: 10px 12px;
        }

        .form-check {
            margin-right: 20px;
        }

        .form-check-input {
            cursor: pointer;
        }

        .form-check-label {
            cursor: pointer;
        }

        .file-info {
            display: block;
            margin-top: 6px;
            color: #6c757d;
            font-size: 13px;
        }

        #statusMessage {
            display: none;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                padding: 15px;
            }

            .page-header h1 {
                font-size: 24px;
            }

            .card-body {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="dashboard-container">

    <!-- Header -->
    <div class="page-header">
        <h1>Form Izin/Sakit</h1>
        <p>Input izin atau sakit siswa</p>
    </div>

    <div class="row">

        <div class="col-md-6">

            <div class="card">

                <!-- Card Header -->
                <div class="card-header">
                    <h3 class="card-title">
                        Input Izin/Sakit Siswa
                    </h3>
                </div>

                <!-- Form -->
                <form id="izinForm">

                    <div class="card-body">

                        <!-- Nama Siswa -->
                        <div class="mb-3">

                            <label
                                for="siswa"
                                class="form-label"
                            >
                                Nama Siswa
                                <span class="required">*</span>
                            </label>

                            <select
                                id="siswa"
                                class="form-select"
                                required
                            >

                                <option value="">
                                    -- Pilih Siswa --
                                </option>

                                <option value="1">
                                    Ahmad Fauzan - 0012345678
                                </option>

                                <option value="2">
                                    Muhammad Rizky - 0012345679
                                </option>

                                <option value="3">
                                    Siti Aisyah - 0012345680
                                </option>

                                <option value="4">
                                    Nurul Hidayah - 0012345681
                                </option>

                                <option value="5">
                                    Budi Santoso - 0012345682
                                </option>

                                <option value="6">
                                    Dimas Pratama - 0012345683
                                </option>

                            </select>

                        </div>


                        <!-- Keterangan -->
                        <div class="mb-3">

                            <label class="form-label">
                                Keterangan
                                <span class="required">*</span>
                            </label>

                            <div>

                                <div class="form-check form-check-inline">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="keterangan"
                                        id="izin"
                                        value="izin"
                                        required
                                    >

                                    <label
                                        class="form-check-label"
                                        for="izin"
                                    >
                                        Izin
                                    </label>

                                </div>


                                <div class="form-check form-check-inline">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="keterangan"
                                        id="sakit"
                                        value="sakit"
                                        required
                                    >

                                    <label
                                        class="form-check-label"
                                        for="sakit"
                                    >
                                        Sakit
                                    </label>

                                </div>

                            </div>

                        </div>


                        <!-- Alasan -->
                        <div class="mb-3">

                            <label
                                for="alasan"
                                class="form-label"
                            >
                                Alasan
                                <span class="required">*</span>
                            </label>

                            <textarea
                                id="alasan"
                                class="form-control"
                                rows="3"
                                placeholder="Masukkan alasan izin atau sakit"
                                required
                            ></textarea>

                        </div>


                        <!-- Upload Bukti -->
                        <div class="mb-3">

                            <label
                                for="foto"
                                class="form-label"
                            >
                                Upload Bukti (Opsional)
                            </label>

                            <input
                                type="file"
                                class="form-control"
                                id="foto"
                                accept="image/jpeg,image/jpg,image/png"
                            >

                            <small class="file-info">
                                Format: JPG, JPEG, PNG. Maks 2MB
                            </small>

                        </div>


                        <!-- Status -->
                        <div
                            id="statusMessage"
                            class="alert"
                        ></div>

                    </div>


                    <!-- Footer -->
                    <div class="card-footer">

                        <button
                            type="submit"
                            class="btn btn-primary"
                            id="btnSimpan"
                        >
                            <i class="bi bi-save"></i>
                            Simpan
                        </button>

                        <button
                            type="reset"
                            class="btn btn-secondary"
                            id="btnReset"
                        >
                            <i class="bi bi-arrow-clockwise"></i>
                            Reset
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>


<script>

    const form = document.getElementById("izinForm");
    const siswa = document.getElementById("siswa");
    const alasan = document.getElementById("alasan");
    const foto = document.getElementById("foto");

    const btnSimpan = document.getElementById("btnSimpan");
    const btnReset = document.getElementById("btnReset");

    const statusMessage = document.getElementById("statusMessage");


    /*
     * ==========================================
     * VALIDASI FILE
     * ==========================================
     */

    foto.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {
            return;
        }

        const allowedTypes = [
            "image/jpeg",
            "image/jpg",
            "image/png"
        ];

        const maxSize = 2 * 1024 * 1024;


        if (!allowedTypes.includes(file.type)) {

            showStatus(
                "danger",
                '<i class="bi bi-exclamation-circle"></i> ' +
                "Format file harus JPG, JPEG, atau PNG."
            );

            this.value = "";

            return;
        }


        if (file.size > maxSize) {

            showStatus(
                "danger",
                '<i class="bi bi-exclamation-circle"></i> ' +
                "Ukuran file maksimal 2MB."
            );

            this.value = "";

            return;
        }


        statusMessage.style.display = "none";

    });


    /*
     * ==========================================
     * SUBMIT FORM
     * ==========================================
     */

    form.addEventListener("submit", function (event) {

        event.preventDefault();


        const siswaText =
            siswa.options[siswa.selectedIndex].text;

        const keterangan =
            document.querySelector(
                'input[name="keterangan"]:checked'
            )?.value;


        if (!siswa.value) {

            showStatus(
                "danger",
                '<i class="bi bi-exclamation-circle"></i> ' +
                "Silakan pilih siswa."
            );

            return;
        }


        if (!keterangan) {

            showStatus(
                "danger",
                '<i class="bi bi-exclamation-circle"></i> ' +
                "Silakan pilih keterangan Izin atau Sakit."
            );

            return;
        }


        if (!alasan.value.trim()) {

            showStatus(
                "danger",
                '<i class="bi bi-exclamation-circle"></i> ' +
                "Alasan wajib diisi."
            );

            return;
        }


        /*
         * Tombol processing
         */

        btnSimpan.disabled = true;

        btnSimpan.innerHTML = `
            <span
                class="spinner-border spinner-border-sm"
                role="status"
            ></span>
            Menyimpan...
        `;


        /*
         * Simulasi penyimpanan
         */

        setTimeout(function () {

            const jenis =
                keterangan === "izin"
                    ? "Izin"
                    : "Sakit";


            showStatus(
                "success",
                `
                <i class="bi bi-check-circle"></i>

                <strong>Data berhasil disimpan!</strong>

                <br><br>

                <strong>Siswa:</strong>
                ${siswaText}

                <br>

                <strong>Keterangan:</strong>
                ${jenis}

                <br>

                <strong>Alasan:</strong>
                ${alasan.value}
                `
            );


            btnSimpan.disabled = false;

            btnSimpan.innerHTML = `
                <i class="bi bi-save"></i>
                Simpan
            `;


        }, 1000);

    });


    /*
     * ==========================================
     * RESET
     * ==========================================
     */

    btnReset.addEventListener("click", function () {

        statusMessage.style.display = "none";

        statusMessage.innerHTML = "";

        statusMessage.className = "alert";

    });


    /*
     * ==========================================
     * STATUS
     * ==========================================
     */

    function showStatus(type, message) {

        statusMessage.className =
            "alert alert-" + type;

        statusMessage.innerHTML =
            message;

        statusMessage.style.display =
            "block";

    }

</script>

</body>
</html>
